<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GP9 AI · Xác thực</title><style>body{font:16px system-ui,sans-serif;background:#f7f8fa;color:#17212b;margin:0}main{max-width:560px;background:white;margin:8vh auto;padding:28px;border:1px solid #d9e1e8;border-radius:12px}h1{font-size:1.5rem}label{display:block;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;font:inherit}button{padding:11px 16px;margin:16px 10px 0 0;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.muted{color:#5b6775}#error{color:#a02222}#client{white-space:pre-wrap}</style></head><body><main><h1>GP9 AI · Xác thực</h1><p class="muted">Chỉ sử dụng tài khoản được GP9 AI cấp quyền. Việc đăng nhập không tự cấp quyền Cập nhật GP9 AI.</p><p id="status">Đang kiểm tra phiên đăng nhập…</p><p id="error" role="alert"></p><section id="login" hidden><form id="form"><label for="email">Email tài khoản GP9 AI</label><input id="email" type="email" autocomplete="email" required><button type="submit">Gửi liên kết đăng nhập</button></form><p class="muted">Liên kết gửi qua Supabase Auth; chỉ tài khoản đã tồn tại mới đăng nhập được.</p></section><section id="consent" hidden><h2>Chấp thuận truy cập</h2><p id="client"></p><p id="scopes"></p><button id="approve" type="button">Chấp thuận</button><button id="deny" type="button">Từ chối</button></section></main><script src="https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script><script>
(async()=>{const $=id=>document.getElementById(id);const root=location.origin+"/gp9-ai-auth/";const project="https://lebqqcnvinfxwaeztixh.supabase.co";const anon="sb_publishable_TG43S9lk6H7cisWo-jWTXQ_ZHSj0-HX";const status=$("status"),error=$("error"),login=$("login"),consent=$("consent");const fail=e=>{error.textContent=e?.message||"Không thể hoàn tất xác thực.";status.textContent="Đã dừng; vui lòng thử lại khi hệ thống sẵn sàng."};if(!window.supabase?.createClient){fail(new Error("Không tải được ứng dụng xác thực."));return;}const client=window.supabase.createClient(project,anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const current=new URL(location.href);let authorizationId=current.searchParams.get("authorization_id");if(authorizationId&&!/^[a-zA-Z0-9_-]{8,160}$/.test(authorizationId)){fail(new Error("Yêu cầu chấp thuận không hợp lệ."));return;}if(authorizationId)localStorage.setItem("gp9_oauth_pending",JSON.stringify({id:authorizationId,at:Date.now()}));if(!authorizationId&&current.pathname===new URL(root).pathname){try{const pending=JSON.parse(localStorage.getItem("gp9_oauth_pending")||"null");if(pending&&Date.now()-pending.at<600000){location.replace(root+"oauth/consent/?authorization_id="+encodeURIComponent(pending.id));return;}}catch{}}
const userResponse=await client.auth.getUser();if(!authorizationId){status.textContent=userResponse.data.user?"Đã đăng nhập. Chỉ kết nối từ ứng dụng được GP9 AI phê duyệt mới có thể yêu cầu chấp thuận.":"Sẵn sàng đăng nhập khi có yêu cầu OAuth hợp lệ.";return;}if(!userResponse.data.user){status.textContent="Đăng nhập để xem yêu cầu chấp thuận.";login.hidden=false;$("form").onsubmit=async ev=>{ev.preventDefault();error.textContent="";const button=$("form").querySelector("button");button.disabled=true;const {error:sendError}=await client.auth.signInWithOtp({email:$("email").value.trim(),options:{shouldCreateUser:false,emailRedirectTo:root}});button.disabled=false;if(sendError){fail(sendError);return;}status.textContent="Nếu tài khoản đã tồn tại, kiểm tra email để mở liên kết đăng nhập.";};return;}
status.textContent="Đang tải thông tin yêu cầu…";const details=await client.auth.oauth.getAuthorizationDetails(authorizationId);if(details.error){fail(details.error);return;}if(details.data?.redirect_url){localStorage.removeItem("gp9_oauth_pending");location.assign(details.data.redirect_url);return;}if(!details.data?.authorization_id){fail(new Error("Không nhận được chi tiết yêu cầu chấp thuận."));return;}const data=details.data;status.textContent="Đã xác thực tài khoản.";consent.hidden=false;$("client").textContent="Ứng dụng yêu cầu: "+(data.client?.name||"Không xác định");$("scopes").textContent="Phạm vi: "+(Array.isArray(data.scope)?data.scope.join(", "):data.scope||"không rõ");async function decide(approve){error.textContent="";$("approve").disabled=$("deny").disabled=true;const result=approve?await client.auth.oauth.approveAuthorization(authorizationId):await client.auth.oauth.denyAuthorization(authorizationId);if(result.error){$("approve").disabled=$("deny").disabled=false;fail(result.error);return;}if(!result.data?.redirect_url){fail(new Error("Không nhận được URL trả về từ OAuth Server."));return;}localStorage.removeItem("gp9_oauth_pending");location.assign(result.data.redirect_url);}$("approve").onclick=()=>decide(true);$("deny").onclick=()=>decide(false);
})().catch(e=>{document.getElementById("error").textContent=e?.message||"Lỗi xác thực.";});
</script></body></html>
